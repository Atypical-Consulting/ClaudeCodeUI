name: Release

on:
  push:
    branches: [main]
  # Dry run: builds (and, when the Apple secrets exist, signs and notarizes) every installer without
  # publishing anything; the bundles land as workflow artifacts.
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  id-token: write      # build provenance attestations
  attestations: write

jobs:
  release-please:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
      id: ${{ steps.rp.outputs.id }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: rp

  desktop:
    needs: release-please
    if: ${{ !cancelled() && (github.event_name == 'workflow_dispatch' || needs.release-please.outputs.release_created == 'true') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            rid: win-x64
          - os: macos-latest
            target: aarch64-apple-darwin
            rid: osx-arm64
          - os: macos-15-intel # last Intel macOS runner (macos-13 is retired)
            target: x86_64-apple-darwin
            rid: osx-x64
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            rid: linux-x64
    runs-on: ${{ matrix.os }}
    env:
      APPLE_SIGNING: ${{ secrets.APPLE_CERTIFICATE != '' }}
    steps:
      - uses: actions/checkout@v7

      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Publish the server (${{ matrix.rid }})
        run: dotnet publish ClaudeCodeUI.csproj -c Release -r ${{ matrix.rid }} --self-contained -p:PublishSingleFile=true -p:DebugType=none -o desktop/src-tauri/server

      # macOS signing. Tauri signs the app binary, not files under resources/, so the bundled .NET server is signed
      # here first (hardened runtime + Entitlements.plist), with the same Developer ID; Tauri then signs and notarizes the app.
      - name: Import the Developer ID certificate
        if: runner.os == 'macOS' && env.APPLE_SIGNING == 'true'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          kp=$(openssl rand -hex 16)
          echo "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$kp" build.keychain
          security list-keychains -d user -s build.keychain login.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$kp" build.keychain
          security set-keychain-settings -t 3600 -u build.keychain
          security import "$RUNNER_TEMP/cert.p12" -k build.keychain -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$kp" build.keychain
          rm "$RUNNER_TEMP/cert.p12"
          id=$(security find-identity -v -p codesigning build.keychain | awk -F'"' '/Developer ID Application/ { print $2; exit }')
          test -n "$id" || { echo "::error::no 'Developer ID Application' identity in APPLE_CERTIFICATE"; exit 1; }
          echo "APPLE_SIGNING_IDENTITY=$id" >> "$GITHUB_ENV"
          printf '%s' "$APPLE_API_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"
          echo "APPLE_API_KEY_PATH=$RUNNER_TEMP/AuthKey.p8" >> "$GITHUB_ENV"

      - name: Sign the bundled server
        if: runner.os == 'macOS' && env.APPLE_SIGNING == 'true'
        run: codesign --force --timestamp --options runtime --entitlements desktop/src-tauri/Entitlements.plist --sign "$APPLE_SIGNING_IDENTITY" desktop/src-tauri/server/ClaudeCodeUI

      - run: npm ci
        working-directory: desktop

      # releaseId, not tagName: with a tag, tauri-action v1 rewrites the existing release's body (to empty when no
      # releaseBody is given), which would erase release-please's notes. With an id it only uploads the assets.
      - uses: tauri-apps/tauri-action@v1
        id: tauri
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
        with:
          projectPath: desktop
          releaseId: ${{ needs.release-please.outputs.id }}
          uploadWorkflowArtifacts: ${{ github.event_name == 'workflow_dispatch' }}
          args: --target ${{ matrix.target }}

      - name: Check the signature and notarization
        if: runner.os == 'macOS' && env.APPLE_SIGNING == 'true'
        run: |
          app=$(ls -d desktop/src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.app | head -1)
          codesign --verify --deep --strict --verbose=2 "$app"
          codesign --display --verbose=2 "$app/Contents/Resources/server/ClaudeCodeUI" 2>&1 | grep -E 'Authority=Developer ID|flags=.*runtime'
          spctl --assess --type execute --verbose=4 "$app"
          xcrun stapler validate "$app"

      - uses: actions/attest-build-provenance@v4
        if: github.event_name == 'push'
        with:
          subject-path: |
            desktop/src-tauri/target/${{ matrix.target }}/release/bundle/**/*.dmg
            desktop/src-tauri/target/${{ matrix.target }}/release/bundle/**/*.msi
            desktop/src-tauri/target/${{ matrix.target }}/release/bundle/**/*-setup.exe
            desktop/src-tauri/target/${{ matrix.target }}/release/bundle/**/*.AppImage
            desktop/src-tauri/target/${{ matrix.target }}/release/bundle/**/*.deb
            desktop/src-tauri/target/${{ matrix.target }}/release/bundle/**/*.rpm

  # One SHA256SUMS file next to the installers, for users who verify their download by hand.
  checksums:
    needs: [release-please, desktop]
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ needs.release-please.outputs.tag_name }}
    steps:
      - run: |
          mkdir assets && cd assets
          gh release download "$TAG" -R "$GITHUB_REPOSITORY"
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS
          gh release upload "$TAG" SHA256SUMS -R "$GITHUB_REPOSITORY" --clobber
