name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - run: dotnet build ClaudeCodeUI.csproj
      - run: dotnet run --project ClaudeCodeUI.csproj --no-build -- --self-check

  desktop:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target
      - name: cargo check
        run: |
          mkdir -p desktop/src-tauri/server # bundle.resources must exist; the server is only published for releases
          cargo check --manifest-path desktop/src-tauri/Cargo.toml
