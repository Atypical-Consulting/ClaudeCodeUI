name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: taiki-e/install-action@v2
        with:
          tool: trunk@0.22.1
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target
      # The shell embeds ui/dist (tauri.conf.json frontendDist): build it first so the desktop crate compiles.
      - name: trunk build
        run: trunk build
        working-directory: ui
      - run: cargo check --workspace
      - run: cargo check -p ccui-ui --target wasm32-unknown-unknown
      - run: cargo test --workspace
