[workspace]
resolver = "2"
members = ["crates/shared", "crates/core", "ui", "desktop/src-tauri"]

[workspace.package]
edition = "2021"
license = "MIT"

[workspace.dependencies]
ccui-shared = { path = "crates/shared" }
ccui-core = { path = "crates/core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = true
codegen-units = 1

# The UI is wasm: size matters more than speed.
[profile.release.package.ccui-ui]
opt-level = "z"
