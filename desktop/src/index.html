<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Claude Code UI</title>
<style>
  html, body { margin: 0; height: 100%; background: #0E0F11; color: #9095A0; font: 14px system-ui, sans-serif; color-scheme: dark; }
  body { display: grid; place-items: center; }
  main { display: grid; justify-items: center; gap: 18px; }
  img { width: 112px; height: 112px; animation: bob 1.6s ease-in-out infinite; }
  @keyframes bob { 50% { transform: translateY(-6px); } }
  @media (prefers-reduced-motion: reduce) { img { animation: none; } }
  #msg.err { color: #F07178; }
</style>
</head>
<body>
<main>
  <img src="icon.png" alt="" />
  <div id="msg" role="status">Starting…</div>
</main>
<script>
  // The app itself follows Accept-Language; this splash follows the same OS language.
  var fr = /^fr\b/i.test(navigator.language);
  if (fr) { document.documentElement.lang = 'fr'; document.getElementById('msg').textContent = 'Démarrage…'; }
  // Called by the shell (main.rs) when the server does not come up (stopped = false) or exits later (stopped = true).
  // why is an exit code, or an error the OS worded.
  function fail(why, stopped) {
    var m = document.getElementById('msg');
    if (/^-?\d+$/.test(why)) why = (fr ? 'code de sortie ' : 'exit code ') + why;
    m.className = 'err';
    m.textContent = fr
      ? (stopped ? "Le serveur s'est arrêté" : "Le serveur n'a pas démarré") + ' (' + why + "). Quitte et rouvre l'application ; si ça se reproduit, lance-la depuis un terminal pour voir le journal."
      : (stopped ? 'The server stopped' : 'The server did not start') + ' (' + why + '). Quit and reopen the app; if it keeps happening, run it from a terminal to see the log.';
  }
</script>
</body>
</html>
