[package]
name = "ccui-ui"
version = "0.0.0"
publish = false
edition.workspace = true
license.workspace = true

[dependencies]
ccui-shared.workspace = true
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
rust_decimal.workspace = true
leptos = { version = "0.8", features = ["csr"] }
leptos_router = "0.8"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
serde-wasm-bindgen = "0.6"
js-sys = "0.3"
gloo-timers = { version = "0.3", features = ["futures"] }
console_error_panic_hook = "0.1"
web-sys = { version = "0.3", features = [
  "Window", "Document", "HtmlElement", "Element", "Node", "NodeList", "DomTokenList", "CssStyleDeclaration",
  "Event", "EventTarget", "KeyboardEvent", "MouseEvent", "PointerEvent", "FocusEvent", "InputEvent", "ClipboardEvent",
  "DragEvent", "DataTransfer", "File", "FileList", "Blob", "HtmlInputElement", "HtmlTextAreaElement",
  "HtmlSelectElement", "HtmlDialogElement", "ScrollIntoViewOptions", "ScrollLogicalPosition", "FocusOptions",
  "ResizeObserver", "ResizeObserverEntry", "IntersectionObserver", "IntersectionObserverEntry", "MutationObserver",
  "MutationObserverInit", "MutationRecord", "Storage", "Navigator", "Clipboard", "Location", "Performance", "console",
  "DomRect", "DomStringMap", "AddEventListenerOptions", "EventInit", "KeyboardEventInit", "CustomEvent", "CustomEventInit",
  "Selection", "Range", "Text", "HtmlCollection", "HtmlButtonElement", "HtmlAnchorElement", "HtmlDetailsElement",
  "ScrollToOptions", "ScrollBehavior", "HashChangeEvent",
] }
