[package]
name = "ccui-ui"
version = "0.0.0"
publish = false
edition.workspace = true
license.workspace = true

[dependencies]
ccui-shared.workspace = true
serde.workspace = true
serde_json.workspace = true
leptos = { version = "0.8", features = ["csr"] }
leptos_router = "0.8"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
serde-wasm-bindgen = "0.6"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Window", "Document", "HtmlElement", "Element", "KeyboardEvent", "Storage", "Navigator", "Clipboard"] }
console_error_panic_hook = "0.1"
